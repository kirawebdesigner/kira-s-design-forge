<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page Not Found - Kirubel Daniel</title>
  <meta name="description" content="The requested page could not be found. Return to Kirubel Daniel's portfolio or browse selected work.">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#faf7f3">
  <link rel="icon" href="/assets/kirubel-mark.svg" type="image/svg+xml">
  <link rel="preload" as="font" type="font/woff2" href="/assets/fonts/archivo-800.woff2" crossorigin>
  <style>
    @font-face{font-family:Archivo;src:url('/assets/fonts/archivo-800.woff2') format('woff2');font-weight:800;font-style:normal;font-display:swap}
    :root{color-scheme:light;--paper:#faf7f3;--ink:#111;--muted:#68645f;--line:rgba(17,17,17,.16)}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink)}
    body{font-family:Arial,Helvetica,sans-serif;background-image:radial-gradient(rgba(17,17,17,.055) .65px,transparent .65px);background-size:5px 5px}
    a{color:inherit}
    .skip{position:fixed;top:12px;left:12px;z-index:2;padding:10px 14px;background:var(--ink);color:#fff;transform:translateY(-160%)}
    .skip:focus{transform:none}
    header{display:flex;align-items:center;justify-content:space-between;padding:24px clamp(20px,4vw,64px);border-bottom:1px solid var(--line)}
    .brand{font-weight:800;text-decoration:none;font-size:20px;letter-spacing:-.04em}
    header span{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
    main{min-height:calc(100vh - 75px);display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,.42fr);align-items:stretch}
    .message{display:flex;flex-direction:column;justify-content:center;padding:clamp(48px,8vw,120px) clamp(20px,7vw,110px)}
    .eyebrow{margin:0 0 22px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
    h1{max-width:960px;margin:0;font-family:Archivo,Arial,sans-serif;font-size:clamp(62px,10vw,156px);line-height:.82;letter-spacing:-.075em}
    .copy{max-width:550px;margin:32px 0 0;font-size:clamp(18px,1.7vw,24px);line-height:1.45;color:var(--muted)}
    nav{display:flex;flex-wrap:wrap;gap:10px;margin-top:38px}
    nav a{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 20px;border:1px solid var(--ink);border-radius:999px;text-decoration:none;font-weight:700;transition:transform .2s ease,background .2s ease,color .2s ease}
    nav a:first-child{background:var(--ink);color:#fff}
    nav a:hover{transform:translateY(-2px)}
    nav a:focus-visible{outline:3px solid #356dff;outline-offset:3px}
    .code{display:grid;place-items:center;overflow:hidden;border-left:1px solid var(--line);background:var(--ink);color:var(--paper)}
    .code span{font-family:Archivo,Arial,sans-serif;font-size:clamp(140px,25vw,430px);line-height:.7;letter-spacing:-.1em;writing-mode:vertical-rl;transform:rotate(180deg);opacity:.98}
    @media(max-width:760px){header{padding:18px 20px}main{min-height:calc(100vh - 63px);grid-template-columns:1fr}.message{padding:64px 20px 54px}.code{min-height:180px;border-left:0;border-top:1px solid var(--line)}.code span{font-size:160px;line-height:.8;writing-mode:horizontal-tb;transform:none}.copy{margin-top:24px}nav{margin-top:30px}}
    @media(prefers-reduced-motion:reduce){nav a{transition:none}}
  </style>
</head>
<body>
  <a class="skip" href="#content">Skip to content</a>
  <header><a class="brand" href="/">Kirubel</a><span>Error / 404</span></header>
  <main id="content">
    <section class="message" aria-labelledby="not-found-title">
      <p class="eyebrow">Wrong turn, clear next step</p>
      <h1 id="not-found-title">Page not found.</h1>
      <p class="copy">The address may have changed or the page may no longer exist. Continue with the portfolio or explore the latest product work.</p>
      <nav aria-label="Recovery links"><a href="/">Back home</a><a href="/work/">View selected work</a><a href="mailto:contact@kiraweb.pro.et">Contact Kirubel</a></nav>
    </section>
    <aside class="code" aria-hidden="true"><span>404</span></aside>
  </main>
</body>
</html>
